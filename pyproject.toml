[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "check-the-data"
version = "0.1.0"
description = "Quick descriptive statistics for Polars DataFrames exported to Excel"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
keywords = ["polars", "data-analysis", "descriptive-statistics", "excel", "data-science"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "polars>=0.20.0",
    "pandas>=1.5.0",
    "xlsxwriter>=3.0.0",
]

[project.optional-dependencies]
dev = ["pytest", "black", "flake8"]

[project.urls]
Homepage = "https://github.com/pradeepmav/check_the_data"
Repository = "https://github.com/pradeepmav/check_the_data"
Issues = "https://github.com/pradeepmav/check_the_data/issues"

[tool.setuptools.packages.find]
where = ["src"]
